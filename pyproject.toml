[project]
authors = [{ name = "Dan Egnor", email = "egnor@ofb.net" }]
dependencies = ["click>=8.3.1", "ok-logging-setup>=0.17", "ok-serial>=0.4"]
description = "Interactive serial port terminal (based on ok-serial)"
name = "ok-serial-terminal"
readme = "README.md"
requires-python = ">=3.11"
urls.Homepage = "https://github.com/egnor/ok-serial-terminal#readme"
urls.Repository = "https://github.com/egnor/ok-serial-terminal.git"
version = "0.1"

[project.scripts]
okterm = "ok_serial_terminal.main:main"
# alias so `uvx ok-serial-terminal` / `pipx run ok-serial-terminal` work; both
# look for an executable named after the package
ok-serial-terminal = "ok_serial_terminal.main:main"

[build-system]
requires = ["uv_build>=0.9.13", "uv_build<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy~=2.3",
  "pytest~=9.1",
  "pytest-asyncio~=1.4",
  "pytest-mock~=3.15",
  "ruff~=0.15",
]

[tool.mypy]
check_untyped_defs = true
exclude_gitignore = true
files = "."
warn_unreachable = true

[tool.pytest]
asyncio_mode = "auto"
log_level = "CRITICAL"
strict = true

[tool.ruff]
line-length = 80

[tool.uv.build-backend]
module-root = ""
